<!DOCTYPE html>
<html lang="fr">
 <head>
<meta charset="utf-8"/>

  <title>

  <link href="assets/css/style.css" rel="stylesheet"/>

 <body data-page="home">
  <div id="header">
  </div>

   <section class="hero">
    <div class="container">

      Bienvenue chez Ammu-Nation Nord

   <section class="section" >

     <div class="section-head">

      </h2>

      </a>
